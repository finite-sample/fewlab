name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      # The reusable workflow defaults to ["3.11", "3.14"], and this package's
      # requires-python floor is 3.12 -- a 3.11 leg cannot even resolve.
      python-versions: '["3.12", "3.13", "3.14"]'
      wheel-import: fewlab
      coverage-floor: 82
      run-preen: true
